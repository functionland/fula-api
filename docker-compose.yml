# Fula Storage - Complete Development Stack
# Run with: docker-compose up -d

version: "3.8"

services:
  # ============================================
  # Fula Gateway - S3-Compatible API
  # ============================================
  gateway:
    build:
      context: /opt/fula-api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # --- Load-relief for gc-damaged buckets (2026-06-07) ---
      # Stop the one-time fleet-wide index-node backfill: on damaged buckets it
      # re-walks every index, hits hard-loss nodes at ~6s each, and burns
      # gateway/kubo capacity on every restart for no gain (per-PUT pinning still
      # protects active buckets). Reversible: remove this line to re-enable.
      - FULA_NO_LOCAL_RETAIN_BACKFILL=1
      # Tighten the bounded-read budget so a gc-orphaned block fails over to the
      # cluster-mirror fallback in ~3s instead of ~6s (offline-miss + fast 1s +
      # slow 2s). Modest + reversible; peering keeps live holders sub-second so
      # healthy remote reads are unaffected. Raise if legit slow holders 410.
      - FULA_READ_FAST_TIMEOUT_SECS=1
      - FULA_READ_SLOW_TIMEOUT_SECS=2
    volumes:
      - /var/lib/fula-gateway:/var/lib/fula-gateway
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # Redis (optional - for multi-gateway sync)
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - fula-network
    profiles:
      - full

  # ============================================
  # Prometheus (optional - monitoring)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - fula-network
    profiles:
      - monitoring

  # ============================================
  # Grafana (optional - dashboards)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - fula-network
    profiles:
      - monitoring

# ============================================
# Networks
# ============================================
networks:
  fula-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  redis-data:
  prometheus-data:
  grafana-data:
