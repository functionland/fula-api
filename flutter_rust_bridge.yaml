# flutter_rust_bridge v2 configuration
# https://cjycode.com/flutter_rust_bridge/

# v2 syntax: rust_input is a module path, not a file path
rust_input: crate::api
rust_root: crates/fula-flutter
dart_output: packages/fula_client/lib/src

# Generate for both FFI (mobile) and WASM (web)
web: true

# Use Dart 3 features
dart3: true

# Generate full dependencies
full_dep: true
