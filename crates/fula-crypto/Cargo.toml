[package]
name = "fula-crypto"
description = "Cryptographic primitives for Fula decentralized storage - HPKE encryption, BLAKE3 hashing, and Bao verified streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["tokio-runtime"]
# Enable WASM support (requires getrandom/js for browser randomness)
# Note: wasm feature excludes tokio-runtime (incompatible)
wasm = ["getrandom/js"]
# Enable tokio-based async streaming (not WASM compatible)
tokio-runtime = ["tokio"]
# Test-only fault injection knobs (e.g. FORCE_INITIAL_SHARD_COUNT).
# Off by default so production builds never carry the override atomics.
test-fault-injection = []

[dependencies]
# Core crypto
blake3 = { workspace = true }
bao-tree = { workspace = true }
hpke = { workspace = true }
rand = { workspace = true }
getrandom = "0.2"
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
argon2 = "0.5"

# Post-Quantum Cryptography (NIST FIPS 203 ML-KEM)
# Using Cryspen's formally verified implementation for WASM + native support
libcrux-ml-kem = { version = "0.0.4", default-features = false, features = ["mlkem768"] }
hkdf = "0.12"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

# Async (tokio is optional for WASM compatibility)
tokio = { workspace = true, optional = true }
async-trait = { workspace = true }
async-recursion = { workspace = true }
async-lock = "3"
futures = { workspace = true }

# IPLD/CID
# `serde` feature enables Cid's Serialize/Deserialize impls for the
# walkable-v8 `PointerWire::LinkV2 { storage_key, cid }` wire format.
cid = { workspace = true, features = ["serde"] }
multihash = { workspace = true }
multihash-codetable = { workspace = true }

# Utilities
bytes = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
zeroize = { version = "1.8", features = ["derive"] }

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
test-log = { workspace = true }
tempfile = { workspace = true }
rstest = { workspace = true }
tokio-test = "0.4"

[[bench]]
name = "crypto_benchmarks"
harness = false

# Walkable-v8 (W.9.7) scale benchmark — measures the curves the
# `walkable_v8_block_size_*` tests don't measure (write throughput,
# walk time, manifest size). Manually run via:
#   cargo bench --bench walkable_v8_scale
[[bench]]
name = "walkable_v8_scale"
harness = false
