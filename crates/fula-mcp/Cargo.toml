[package]
name = "fula-mcp"
description = "MCP server for Fula decentralized storage (Phase 1: crypto + client round-trip spike; no MCP protocol yet)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Reuse the existing crypto + client crates — do NOT reimplement crypto.
fula-crypto = { path = "../fula-crypto" }
fula-client = { path = "../fula-client" }

# Async runtime + error handling for the library surface.
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }

# Capability-bundle (de)serialization + key material handling (P3).
#  - serde/serde_json: parse the injected capability-bundle JSON.
#  - base64: decode the 32-byte secret/key fields carried in the bundle.
#  - zeroize: wipe intermediate decoded secret bytes after constructing the keys.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
zeroize = "1.8"

[dev-dependencies]
# Test-only helpers: RNG for random payloads, uuid for isolated e2e keys,
# hex for derived-key debug output. (serde_json/base64 are now in [dependencies].)
rand = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
