[package]
name = "fula-mcp"
description = "MCP server for Fula decentralized storage (Phase 1: crypto + client round-trip spike; no MCP protocol yet)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Reuse the existing crypto + client crates — do NOT reimplement crypto.
fula-crypto = { path = "../fula-crypto" }
fula-client = { path = "../fula-client" }

# Async runtime + error handling for the library surface.
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }

# Capability-bundle (de)serialization + key material handling (P3).
#  - serde/serde_json: parse the injected capability-bundle JSON.
#  - base64: decode the 32-byte secret/key fields carried in the bundle.
#  - zeroize: wipe intermediate decoded secret bytes after constructing the keys.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
zeroize = "1.8"

# Filename->MIME fallback for categorization (P4), mirroring the Dart `mime`
# package's lookupMimeType. The de-facto Rust equivalent.
mime_guess = "2"

# Per-file unique key segment (`ai/<category>/<uuid>-<name>`) in store_file (P5).
# Used in library code (not just tests), so it lives in [dependencies].
uuid = { workspace = true }

[dev-dependencies]
# Test-only helpers: RNG for random payloads, hex for derived-key debug output.
# (serde_json/base64/uuid are now in [dependencies].)
rand = { workspace = true }
hex = { workspace = true }
