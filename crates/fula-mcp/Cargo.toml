[package]
name = "fula-mcp"
description = "MCP server for Fula decentralized storage (Phase 1: crypto + client round-trip spike; no MCP protocol yet)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Reuse the existing crypto + client crates — do NOT reimplement crypto.
fula-crypto = { path = "../fula-crypto" }
fula-client = { path = "../fula-client" }

# Async runtime + error handling for the library surface.
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
# stderr structured logging for the binary's audit events (stdout is the JSON-RPC
# MCP channel, so all logs go to stderr). Used by `src/bin/fula-mcp.rs`.
tracing-subscriber = { workspace = true }

# Capability-bundle (de)serialization + key material handling (P3).
#  - serde/serde_json: parse the injected capability-bundle JSON.
#  - base64: decode the 32-byte secret/key fields carried in the bundle.
#  - zeroize: wipe intermediate decoded secret bytes after constructing the keys.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
zeroize = "1.8"

# Collaboration manifest + collab-file crypto (`manifest.rs`): a byte-exact Rust
# port of the Dart `share_link_builder.dart` / `CollaborationService` routines
# (and the TS portal's `sharingService.ts`). The RustCrypto primitives are used
# DIRECTLY (rather than via fula-crypto's `Aead`) for full control over the
# on-wire layout the Dart/WebCrypto side produces: HKDF-SHA256 with an EMPTY salt
# for key derivation, and AES-256-GCM with a 12-byte random nonce laid out as
# `nonce(12) || ciphertext || tag(16)`. Workspace pins: sha2=0.10, aes-gcm=0.10.
hkdf = "0.12"
sha2 = { workspace = true }
aes-gcm = { workspace = true }

# Filename->MIME fallback for categorization (P4), mirroring the Dart `mime`
# package's lookupMimeType. The de-facto Rust equivalent.
mime_guess = "2"

# Per-file unique key segment (`ai/<category>/<uuid>-<name>`) in store_file (P5).
# Used in library code (not just tests), so it lives in [dependencies].
uuid = { workspace = true }

# ── MCP protocol layer (P9: stdio server) ────────────────────────────────────
# The official Model Context Protocol Rust SDK (modelcontextprotocol/rust-sdk).
#  - server:       the ServerHandler + tool-router machinery.
#  - macros:       the #[tool_router] / #[tool] / #[tool_handler] attribute macros.
#  - transport-io: the server-side stdio transport (`rmcp::transport::stdio()`).
# We deliberately do NOT enable client / http / auth / prompts / tasks: this
# crate is a stdio tool server only, so a minimal feature set keeps the
# dependency + attack surface small.
rmcp = { version = "1.7", default-features = false, features = ["server", "macros", "transport-io"] }
# JSON-schema derive for the tool argument structs. rmcp re-exports a compatible
# `schemars` when its `schemars` feature is on, but we depend on it directly so
# `#[derive(schemars::JsonSchema)]` is in scope for our arg types; the version
# must match what rmcp's `Parameters<T>` bound expects.
schemars = "1"

# HTTP client for the collaboration `/api/collab/*` endpoints (collab.rs) and the
# P10 quota pre-check (`GET {storage_api_url}/api/v1/storage`). Inherited from the
# workspace (default-features off + rustls-tls + json) so we match the workspace
# TLS stack rather than pulling a second one — same as `fula-cli`.
reqwest = { workspace = true }

# ISO-8601 timestamps for the collaboration manifest's `addedAt` / `updatedAt`
# fields (and the merge `now`), matching the Dart `DateTime.toIso8601String()`
# shape the `manifest.rs` model parses (`YYYY-MM-DDTHH:MM:SS.mmmZ`). Workspace
# pin 0.4 (serde feature unused here — we only format, never (de)serialize a
# `DateTime`).
chrono = { workspace = true }

[dev-dependencies]
# Test-only helpers: RNG for random payloads, hex for derived-key debug output.
# (serde_json/base64/uuid are now in [dependencies].)
rand = { workspace = true }
hex = { workspace = true }
# The transport smoke test (tests/p9_mcp_transport_smoke.rs) drives an in-process
# rmcp CLIENT against our server over a `tokio::io::duplex` pipe to exercise the
# real `initialize` + `tools/list` handshake. The production binary does NOT
# enable the client feature (it is a server only); we add it here, test-only, so
# the smoke test can speak the protocol without spawning a subprocess.
rmcp = { version = "1.7", default-features = false, features = ["server", "client", "macros", "transport-io"] }
# `tokio::io::duplex` lives behind the `io-util` feature; the workspace tokio
# already enables "full", so this is just an explicit note. (No extra dep.)
tokio = { workspace = true }
# Mock HTTP server for the collab-client WIRING tests (`tests/collab_http_mock.rs`):
# asserts the reqwest calls hit the documented `/api/collab/*` path + query +
# headers + body shape WITHOUT a real server. This covers the one layer the pure
# parse tests cannot (it does NOT replace the live e2e — the real server's
# behavior still needs `collab_read_e2e` / `collab_write_e2e`).
wiremock = { workspace = true }
