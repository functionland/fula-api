[package]
name = "fula-js"
description = "JavaScript/TypeScript SDK for Fula decentralized storage - WASM bindings"
# Hard-coded (not workspace-inherited) because wasm-pack <= 0.13 fails
# to parse `*.workspace = true` keys in its own manifest scan. Keep
# these in sync with `[workspace.package]` in the root Cargo.toml.
version = "0.6.10"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/functionland/fula-api"
authors = ["Functionland <contact@functionland.com>"]
rust-version = "1.83"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Internal crates (WASM-compatible configuration)
fula-client = { path = "../fula-client" }
fula-crypto = { path = "../fula-crypto", default-features = false, features = ["wasm"] }

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Serialization for JS interop
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"

# Error handling
console_error_panic_hook = "0.1"

# Random number generation for WASM
getrandom = { version = "0.2", features = ["js"] }

# Utilities
bytes = { workspace = true }
base64 = { workspace = true }

# Async (WASM-compatible)
futures = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
