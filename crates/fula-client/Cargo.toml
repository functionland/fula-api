[package]
name = "fula-client"
description = "Client SDK for Fula decentralized storage - S3-compatible with client-side encryption"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }

# Async
futures = { workspace = true }

# Time
chrono = { workspace = true }

# Utilities
bytes = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
url = "2.5"
base64 = { workspace = true }
hex = { workspace = true }
mime_guess = "2.0"

# Platform-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native: use default features (includes tokio-runtime)
fula-crypto = { path = "../fula-crypto" }
reqwest = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WASM: disable default features (no tokio), enable wasm feature
fula-crypto = { path = "../fula-crypto", default-features = false, features = ["wasm"] }
# For WASM: no default features, no stream (which pulls in tokio)
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# uuid needs js feature for WASM randomness
uuid = { version = "1.11", features = ["v4", "serde", "js"] }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = "0.4"
wiremock = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Enable client-side encryption
encryption = []
# Enable WASM support for web browsers (automatic via target config)
wasm = []
