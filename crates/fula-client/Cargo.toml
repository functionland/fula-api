[package]
name = "fula-client"
description = "Client SDK for Fula decentralized storage - S3-compatible with client-side encryption"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }

# Async
futures = { workspace = true }

# Time
chrono = { workspace = true }
# Drop-in replacement for std::time::Instant that uses performance.now() on
# wasm32-unknown-unknown. std::time::Instant::now() panics in browser WASM
# ("time not implemented on this platform"), which broke the v1→v7 forest
# migration path on the web target. On native targets web-time delegates to
# std, so this is a transparent shim.
web-time = "1"

# Utilities
bytes = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
url = "2.5"
base64 = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
mime_guess = "2.0"
tokio = { version = "1.42", default-features = false, features = ["sync"] }
dashmap = { workspace = true }
async-trait = { workspace = true }

# Platform-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native: use default features (includes tokio-runtime)
fula-crypto = { path = "../fula-crypto" }
reqwest = { workspace = true }
uuid = { workspace = true }
fs2 = "0.4"
dirs = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WASM: disable default features (no tokio), enable wasm feature
fula-crypto = { path = "../fula-crypto", default-features = false, features = ["wasm"] }
# For WASM: no default features, no stream (which pulls in tokio)
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# uuid needs js feature for WASM randomness
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
# MultipartAbortGuard Drop impl spawns the abort future on wasm
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { workspace = true }
tokio-test = "0.4"
wiremock = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Enable client-side encryption
encryption = []
# Enable WASM support for web browsers (automatic via target config)
wasm = []
# Exposes crash-injection atomics in encryption.rs so integration tests can
# simulate abort between migration phases. Off in production builds.
# Pulls through to fula-crypto to enable the FORCE_INITIAL_SHARD_COUNT override.
test-fault-injection = ["fula-crypto/test-fault-injection"]
