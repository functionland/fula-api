[package]
name = "fula-flutter"
description = "Flutter bindings for Fula decentralized storage - works on Android and Web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# flutter_rust_bridge
flutter_rust_bridge = "=2.11.1"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Async
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Utilities
bytes = { workspace = true }

# Thread safety
parking_lot = { workspace = true }

# Platform-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native: fula-client with default features (includes tokio)
fula-client = { path = "../fula-client" }
fula-crypto = { path = "../fula-crypto" }
tokio = { workspace = true, features = ["sync", "fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WASM: fula-client without tokio
fula-client = { path = "../fula-client", default-features = false }
fula-crypto = { path = "../fula-crypto", default-features = false, features = ["wasm"] }
wasm-bindgen-futures = "0.4"
# async-lock works on WASM (no OS-specific code)
async-lock = "3.4"

[dev-dependencies]
# For WASM tests
wasm-bindgen-test = "0.3"
# Used by tests/wasm_time_smoke.rs to assert that the wasm-incompat stdlib
# time APIs aren't re-introduced into the migration path.
web-time = "1"

[features]
default = []

# Disable wasm-opt which fails with bulk memory operations
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
