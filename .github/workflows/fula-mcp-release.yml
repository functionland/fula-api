name: fula-mcp Release

# Cross-platform distribution for the `fula-mcp` LOCAL MCP stdio binary, shipped
# as the npm wrapper `@functionland/fula-mcp` (run build-free via
# `npx @functionland/fula-mcp`).
#
# Trigger: a tag of the form `fula-mcp-v*` (e.g. `fula-mcp-v0.6.16`).
#   * Deliberately NOT `v*` — that prefix belongs to flutter-release.yml, which
#     publishes @functionland/fula-client. `fula-mcp-v*` does not match `v*`, so
#     the two release trains never collide.
#
# Release process (user-driven; this workflow only runs on the tag push):
#   1. Bump `crates/fula-mcp/npm/package.json` "version" (and, if desired, the
#      workspace version) on the branch, commit.
#   2. git tag fula-mcp-v0.6.16 && git push origin fula-mcp-v0.6.16
#   3. This workflow cross-compiles all 5 targets, computes SHA-256 of each,
#      writes checksums.json INTO the npm package, uploads binaries + checksums
#      to the GitHub Release, then `npm publish --provenance` via OIDC.
#
# The npm package's version MUST equal the tag's version (the `release` job
# enforces this) so the launcher — which builds the download URL from its own
# package.json version — points at THIS release's assets.
#
# ── ONE-TIME npm setup (NEW package name; see PR body) ───────────────────────
# `@functionland/fula-mcp` does not exist on npm yet. npm's trusted-publisher
# UI is on a package's settings page, so the package must exist first:
#   (a) BOOTSTRAP: one manual `npm publish` of the wrapper (placeholder
#       checksums are safe — they refuse to exec, see checksums.json) to claim
#       the name; OR publish a 0.0.0 stub.
#   (b) Configure the Trusted Publisher on npmjs.com -> the package -> Settings
#       -> Publishing access:
#          Organization or user: functionland
#          Repository:           fula-api
#          Workflow filename:    fula-mcp-release.yml   (filename ONLY, with .yml)
#          Environment name:     npm-publish            (must equal `environment:` below)
#          Allowed actions:      npm publish            (required for configs after 2026-05-20)
#   (c) Thereafter every `fula-mcp-v*` tag publishes with provenance, no token.

on:
  push:
    tags:
      - 'fula-mcp-v*'

permissions: {}  # least privilege by default; each job opts in to what it needs.

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 0. Derive the version from the tag (strip the `fula-mcp-v` prefix) ──────
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version from tag
        id: version
        run: |
          # GITHUB_REF_NAME is e.g. "fula-mcp-v0.6.16" -> "0.6.16"
          VERSION="${GITHUB_REF_NAME#fula-mcp-v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not start with 'fula-mcp-v'." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "fula-mcp version: $VERSION"

  # ── 1. Cross-compile the binary for all 5 targets ──────────────────────────
  build:
    needs: get-version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
            cross: true   # use `cross` (Docker) for the arm64-linux C toolchain
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-fula-mcp-release-${{ matrix.target }}

      - name: Install cross (arm64-linux only)
        if: matrix.cross
        run: cargo install cross --locked

      # rustls (pure-Rust, ring backend) means no OpenSSL cross-compile pain.
      # The non-cross targets build natively on their matching runner.
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build -p fula-mcp --bin fula-mcp --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build -p fula-mcp --bin fula-mcp --release --target ${{ matrix.target }}

      # Rename to the EXACT asset name the launcher downloads:
      #   fula-mcp-{target}{ext}  (== the checksums.json key)
      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/fula-mcp" \
             "dist/fula-mcp-${{ matrix.target }}${{ matrix.ext }}"

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/fula-mcp.exe" \
             "dist/fula-mcp-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/fula-mcp-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  # ── 2. Collect binaries, compute checksums, create the Release ─────────────
  #    Computes checksums.json ONCE from the exact binaries it uploads, so the
  #    bundled checksums provably describe the Release assets. Also stamps the
  #    package version and prepares the npm/ dir for the publish job.
  release:
    needs: [get-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bin-*
          merge-multiple: true   # flatten all bin-*/ into artifacts/

      - name: List collected binaries
        run: ls -la artifacts

      # Writes crates/fula-mcp/npm/checksums.json (version+tag+sha256 map),
      # stamps crates/fula-mcp/npm/package.json to ${version}, and writes
      # artifacts/checksums.txt. FAILS if any of the 5 binaries is missing.
      - name: Compute checksums + stamp version
        run: |
          node crates/fula-mcp/npm/scripts/write-checksums.js \
            --assets artifacts \
            --version "${{ needs.get-version.outputs.version }}" \
            --npm crates/fula-mcp/npm

      - name: Sanity-check the prepared package
        run: |
          echo "checksums.json:"; cat crates/fula-mcp/npm/checksums.json
          echo "package.json version:"; node -p "require('./crates/fula-mcp/npm/package.json').version"

      - name: Create GitHub Release and upload binaries + checksums
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/fula-mcp-*
            artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hand the PREPARED npm dir (with real checksums.json + stamped version)
      # to the publish job. Do NOT recompute checksums downstream.
      - name: Upload prepared npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: crates/fula-mcp/npm/
          retention-days: 1

  # ── 3. Publish the wrapper to npm via OIDC trusted publishing ──────────────
  #    Runs AFTER `release`, so the Release assets exist before the package that
  #    points at them is published. No NPM_TOKEN — OIDC + provenance only.
  publish-npm:
    needs: [get-version, release]
    runs-on: ubuntu-latest
    # MUST match the Environment name in the npm trusted-publisher config.
    # Create a GitHub Environment named `npm-publish` (no protection rules
    # needed — the OIDC binding is the control).
    environment: npm-publish
    permissions:
      id-token: write   # mint the OIDC token for npm trusted publishing
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0.
      - name: Install npm that supports OIDC trusted publishing
        run: npm install --global npm@latest

      - name: Verify npm + node versions
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          # Fail fast if npm < 11.5.1.
          npm --version | awk -F. '($1*1000000 + $2*1000 + $3) < 11005001 { exit 1 }'

      - name: Download prepared npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - name: Verify package version matches the tag
        working-directory: npm-package
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ needs.get-version.outputs.version }}"
          echo "package.json: $PKG_VERSION  tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) != tag version ($TAG_VERSION)" >&2
            exit 1
          fi
          # The bundled checksums must be non-empty (a placeholder would publish
          # a package that can never exec).
          COUNT="$(node -p "Object.keys(require('./checksums.json').checksums||{}).length")"
          echo "bundled checksums: $COUNT"
          if [ "$COUNT" -lt 5 ]; then
            echo "::error::checksums.json has $COUNT entries (<5); refusing to publish." >&2
            exit 1
          fi

      - name: Publish to npm (OIDC trusted publishing, provenance, no token)
        working-directory: npm-package
        # npm detects OIDC automatically from the id-token permission; there is
        # no NODE_AUTH_TOKEN / secrets.NPM_TOKEN. Provenance is generated because
        # this is a public repo publishing a public package via trusted publishing.
        run: npm publish --provenance --access public
