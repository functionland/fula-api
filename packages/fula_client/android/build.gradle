// Android build configuration for fula_flutter
// This plugin uses FFI to load the native Rust library

group 'land.fx.fula_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Specify API level for FFI
    if (project.android.hasProperty("namespace")) {
        namespace 'land.fx.fula_flutter'
    }

    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33

        // NDK configuration for native library
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Include native libraries from jniLibs
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // Build the native library using CMake
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}
