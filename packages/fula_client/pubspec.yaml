name: fula_client
description: Flutter SDK for Fula decentralized storage with client-side encryption, metadata privacy, and secure sharing.
version: 0.6.1
homepage: https://fx.land
repository: https://github.com/functionland/fula-api
issue_tracker: https://github.com/functionland/fula-api/issues
documentation: https://functionland.github.io/fula-api/

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_rust_bridge: ^2.11.0
  freezed_annotation: ^3.1.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  ffigen: ^14.0.0
  freezed: ^3.2.0
  build_runner: ^2.4.0

# Platform support
platforms:
  android:
  ios:
  web:
  windows:

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: FulaClientWeb
        fileName: fula_client_web.dart
